<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Mini App Calculator</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111111 url('tatwole.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 320px;
            position: relative;
        }
        /* Заменили input на div для 100% совместимости с Telegram */
        #display {
            width: 100%;
            height: 65px;
            background-color: #ffffff !important;
            color: #000000 !important;
            border-radius: 12px;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }
        button {
            padding: 18px;
            font-size: 22px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            transition: all 0.1s ease;
        }
        button:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        button.operator {
            background: rgba(243, 156, 18, 0.75);
            color: white;
        }
        button.clear {
            background: rgba(231, 76, 60, 0.75);
            color: white;
        }
        /* Твоя фирменная надпись снизу калькулятора */
        .signature {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- Новый экран, который железно будет выводить текст -->
    <div id="display">0</div>
    
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('-')" class="operator">-</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')" class="operator">+</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="calculateResult()" class="operator" style="grid-row: span 2; height: 100%;">=</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
    
    <!-- Авторский вотермарк -->
    <div class="signature">by Flord</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const display = document.getElementById('display');
    let isNewCalculation = false;

    function appendValue(val) {
        // Если на экране дефолтный 0 или прошлая ошибка — стираем их перед вводом новой цифры
        if (display.innerText === '0' || display.innerText === 'Ошибка' || isNewCalculation) {
            if (!isNaN(val) || val === '.') {
                display.innerText = '';
            }
            isNewCalculation = false;
        }
        display.innerText += val;
        // Автоматически прокручиваем экран вправо при длинном примере
        display.scrollLeft = display.scrollWidth;
    }

    function clearDisplay() {
        display.innerText = '0';
    }

    function calculateResult() {
        try {
            const expression = display.innerText;
            if (!expression || expression === '0') return;
            
            const formattedExpression = expression.replace(/[^0-9+\-*/.]/g, '');
            const result = new Function(`return ${formattedExpression}`)();
            
            if (result === Infinity || isNaN(result)) {
                display.innerText = 'Ошибка';
            } else {
                display.innerText = Number(result.toFixed(4));
                isNewCalculation = true; // Помечаем, что расчёт окончен
            }
        } catch (error) {
            display.innerText = 'Ошибка';
        }
    }
</script>
</body>
</html>
