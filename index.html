<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Mini App Calculator</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            /* Пробуем загрузить картинку tatwole.jpg */
            background: #111111 url('tatwole.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 320px;
        }
        #display {
            width: 100%;
            height: 65px;
            /* Жёстко задаем белый фон и черный текст, чтобы цифры всегда было видно! */
            background-color: #ffffff !important;
            color: #000000 !important;
            border: none;
            border-radius: 12px;
            font-size: 32px;
            font-weight: bold;
            text-align: right;
            padding: 10px 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 18px;
            font-size: 22px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            transition: all 0.1s ease;
        }
        button:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        button.operator {
            background: rgba(243, 156, 18, 0.75);
            color: white;
        }
        button.clear {
            background: rgba(231, 76, 60, 0.75);
            color: white;
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- Поле ввода с гарантированной видимостью -->
    <input type="text" id="display" readonly placeholder="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('-')" class="operator">-</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')" class="operator">+</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="calculateResult()" class="operator" style="grid-row: span 2; height: 100%;">=</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const display = document.getElementById('display');

    function appendValue(val) {
        display.value += val;
        // Прокручиваем экран вправо, если цифр слишком много
        display.scrollLeft = display.scrollWidth;
    }

    function clearDisplay() {
        display.value = '';
    }

    function calculateResult() {
        try {
            const expression = display.value;
            if (!expression) return;
            
            const formattedExpression = expression.replace(/[^0-9+\-*/.]/g, '');
            const result = new Function(`return ${formattedExpression}`)();
            
            if (result === Infinity || isNaN(result)) {
                display.value = 'Ошибка';
            } else {
                display.value = Number(result.toFixed(4));
            }
        } catch (error) {
            display.value = 'Ошибка';
        }
    }
</script>
</body>
</html>
