<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Mini App Calculator</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111111 url('tatwole.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 320px;
        }
        #display {
            width: 100%;
            height: 65px;
            background-color: #ffffff !important;
            color: #000000 !important;
            border-radius: 12px;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }
        button {
            padding: 18px;
            font-size: 22px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            transition: all 0.1s ease;
        }
        button:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        button.operator {
            background: rgba(243, 156, 18, 0.75);
            color: white;
        }
        button.clear {
            background: rgba(231, 76, 60, 0.75);
            color: white;
        }
        .signature {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- Изначально на экране горит просто 0 -->
    <div id="display">0</div>
    
    <div class="buttons">
        <button class="clear" onclick="pressClear()">C</button>
        <button onclick="pressKey('/')" class="operator">/</button>
        <button onclick="pressKey('*')" class="operator">*</button>
        <button onclick="pressKey('-')" class="operator">-</button>
        
        <button onclick="pressKey('7')">7</button>
        <button onclick="pressKey('8')">8</button>
        <button onclick="pressKey('9')">9</button>
        <button onclick="pressKey('+')" class="operator">+</button>
        
        <button onclick="pressKey('4')">4</button>
        <button onclick="pressKey('5')">5</button>
        <button onclick="pressKey('6')">6</button>
        <button onclick="pressEqual()" class="operator" style="grid-row: span 2; height: 100%;">=</button>
        
        <button onclick="pressKey('1')">1</button>
        <button onclick="pressKey('2')">2</button>
        <button onclick="pressKey('3')">3</button>
        
        <button onclick="pressKey('0')" style="grid-column: span 2;">0</button>
        <button onclick="pressKey('.')">.</button>
    </div>
    
    <div class="signature">by Flord</div>
</div>

<script>
    // Разворачиваем приложение в Telegram
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.expand();
    }

    const display = document.getElementById('display');
    let shouldClearOnNextInput = false;

    // Простая и надежная функция ввода символов
    function pressKey(val) {
        if (display.innerText === '0' || display.innerText === 'Ошибка' || shouldClearOnNextInput) {
            // Если ввели точку после очистки, оставляем 0.
            if (val === '.') {
                display.innerText = '0.';
            } else {
                display.innerText = val;
            }
            shouldClearOnNextInput = false;
        } else {
            display.innerText += val;
        }
        display.scrollLeft = display.scrollWidth;
    }

    // Сброс экрана на дефолтный 0
    function pressClear() {
        display.innerText = '0';
        shouldClearOnNextInput = false;
    }

    // Надёжный расчёт без использования сложных обёрток
    function pressEqual() {
        try {
            const expression = display.innerText;
            if (!expression || expression === '0') return;
            
            // Замена всех опасных символов, разрешаем только цифры и знаки
            const cleanExpression = expression.replace(/[^0-9+\-*/.]/g, '');
            
            // Считаем пример через встроенный калькулятор JS
            const result = eval(cleanExpression);
            
            if (result === Infinity || isNaN(result)) {
                display.innerText = 'Ошибка';
            } else {
                // Округляем до 4 знаков после запятой
                display.innerText = Number(result.toFixed(4));
                shouldClearOnNextInput = true;
            }
        } catch (error) {
            display.innerText = 'Ошибка';
        }
    }
</script>
</body>
</html>
